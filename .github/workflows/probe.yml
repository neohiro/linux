name: probe-color-gate
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe environment
        run: |
          echo "TERM=[${TERM:-<unset>}]"
          echo "NO_COLOR=[${NO_COLOR:-<unset>}]"
          echo "FORCE_TTY=[${FORCE_TTY:-<unset>}]"
          echo "PATH=$PATH"
          echo "which bash: $(command -v bash)"
          echo "which tput: $(command -v tput)"
          echo "tput colors: $(tput colors 2>&1)"
          echo "TERM=xterm tput colors: $(TERM=xterm tput colors 2>&1)"
      - name: Probe gate with stub
        run: |
          WD=$(mktemp -d)
          cat > "$WD/tput" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            colors) echo "256"; exit 0 ;;
            *) echo "" 1>&2; exit 1 ;;
          esac
          EOF
          chmod +x "$WD/tput"
          echo "--- stub under stripped PATH ---"
          PATH="$WD:/usr/bin:/bin" bash -c 'command -v tput; tput colors; echo "rc=$?"'
          echo "--- gate result ---"
          PATH="$WD:/usr/bin:/bin" FORCE_TTY=1 bash -c '. lib/color.sh; echo "USE_COLOR=$USE_COLOR"'