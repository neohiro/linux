name: diag-color-gate
on:
  workflow_call:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/linux-checks
      - name: Run color gate diagnostic
        run: |
          set -x
          export NEOHIRO_DIAG=1
          bash tests/test_color_gate.sh 2>&1 | head -40
          echo "=== independent check ==="
          WD=$(mktemp -d)
          printf '#!/bin/bash\necho 256\n' > "$WD/tput"
          chmod +x "$WD/tput"
          PATH="$WD:/usr/bin:/bin" bash -c 'echo "which=$(command -v tput)"; echo "colors=$(tput colors)"'
          echo "=== gate standalone ==="
          PATH="$WD:/usr/bin:/bin" FORCE_TTY=1 bash -c 'set -e; . lib/color-gate.sh; echo "direct=$(_apply_color_gate)"'